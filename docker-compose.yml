version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      # Vision-service internal URL (Docker bridge network — not exposed externally)
      VISION_SERVICE_URL: http://vision-service:8001
      VISION_ENABLED: "true"
      VISION_DEMO_MODE: "true"
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
      vision-service:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ─────────────────────────────────────────────────────────────
  # Vision Microservice
  # Rationale for separate container (senior dev decision):
  #   - ultralytics + easyocr + opencv = ~3GB of dependencies
  #   - Keeping them here prevents backend image from bloating
  #   - Vision service can be GPU-enabled independently in future
  #   - NOT exposed on public ports — only reachable by backend
  #     via Docker bridge network (vision-service:8001)
  # ─────────────────────────────────────────────────────────────
  vision-service:
    build:
      context: ./vision_service
      dockerfile: Dockerfile
    container_name: rag_vision_service
    environment:
      YOLO26_MODEL_PATH: yolo26n.pt
      YOLO26_CONF: "0.4"
      VISION_DEMO_MODE: "true"
      OCR_ENGINE: easyocr
    # No public port exposure — internal Docker network only
    # Remove the comment below ONLY for local debugging
    # ports:
    #   - "8001:8001"
    volumes:
      - yolo_models:/root/.config/ultralytics   # Cache YOLO weights across restarts
      - ./vision_service/app:/app/app
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: rag_neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    ports:
      - "7474:7474" # Browser
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data

volumes:
  postgres_data:
  neo4j_data:
  yolo_models:    # Persists downloaded YOLO26n weights across container restarts
